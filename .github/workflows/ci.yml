name: SwipeX Team-4 CI Pipeline

on:
  push:
    branches:
      - Team-4
  pull_request:
    branches:
      - Team-4

jobs:
  backend-tests:
    name: Backend Unit & Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: swipex
          POSTGRES_PASSWORD: swipex
          POSTGRES_DB: swipex_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create second postgres database (swipex_job)
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=swipex psql -h localhost -U swipex -d swipex_auth -c "CREATE DATABASE swipex_job;"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_mansi/requirements.txt
          pip install -r integration_omkar/requirements.txt
          pip install openpyxl pandas pdfplumber python-multipart

      - name: Lint Integration Code (flake8 scoped to integration_omkar)
        run: |
          python -m flake8 integration_omkar/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run backend_mansi Tests (Auth & Gateway)
        run: |
          pytest backend_mansi/tests/ -v

      - name: Run aiml_hemalatha Tests (ATS & Recommendations)
        run: |
          cd aiml_hemalatha && pytest tests/ -v && cd ..

      - name: Run data_hanith Domain Tests (Job, Swipe & Cache)
        env:
          DATABASE_URL: postgresql://swipex:swipex@localhost:5432/swipex_job
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          if [ -f "data/raw/indian-job-market-dataset-2025.xlsx" ]; then
            pytest tests/ -v
          else
            echo "::notice title=data_hanith tests::Raw dataset (data/raw/indian-job-market-dataset-2025.xlsx) is not committed to the repo, so the data-dependent suite cannot execute in CI. Collecting it to verify the suite imports cleanly; a teammate must vendor the dataset for full execution."
            pytest tests/ --collect-only -q
          fi

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend_boomika
        run: |
          npm ci || npm install

      - name: Build Frontend Application
        working-directory: ./frontend_boomika
        run: |
          npm run build

  integration-check:
    name: Cross-Team Integration Check (Full Stack + Shared Suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed integration paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integration:
              - 'backend_mansi/**'
              - 'aiml_hemalatha/**'
              - 'frontend_boomika/**'
              - 'data_hanith/**'
              - 'docker-compose.dev.yml'
              - 'integration_omkar/**'

      - name: Create local environment file
        if: steps.changes.outputs.integration == 'true'
        run: cp .env.example .env

      - name: Install host test dependencies
        if: steps.changes.outputs.integration == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_mansi/requirements.txt
          pip install -r integration_omkar/requirements.txt
          pip install openpyxl pandas pdfplumber python-multipart

      - name: Rebuild full Docker stack from scratch
        if: steps.changes.outputs.integration == 'true'
        run: |
          docker compose -f docker-compose.dev.yml down --volumes --remove-orphans
          docker compose -f docker-compose.dev.yml up --build -d

      - name: Wait for stack health (reporting failing service)
        if: steps.changes.outputs.integration == 'true'
        run: |
          # Wait for ALL six containers to reach running/healthy.
          # Budget: 60 tries * 5s = 300s to absorb cold first boots on shared
          # GitHub runners (fresh postgres initdb, uvicorn boot, vite startup)
          # which are slower than a warm local machine.
          MAX_TRIES=60
          TRIES=0
          BAD=""
          while [ "$TRIES" -lt "$MAX_TRIES" ]; do
            TRIES=$((TRIES + 1))
            BAD=""
            for c in swipex-postgres swipex-redis swipex-job-data swipex-resume-service swipex-auth-gateway swipex-frontend; do
              state=$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$c" 2>/dev/null || echo "absent")
              echo "CONTAINER $c: $state"
              if [ "$state" != "running/healthy" ]; then
                BAD="$BAD $c($state)"
              fi
            done
            if [ -z "$BAD" ]; then
              echo "ALL SIX SERVICES RUNNING AND HEALTHY after $((TRIES * 5))s"
              break
            fi
            if [ "$TRIES" -lt "$MAX_TRIES" ]; then
              echo "Waiting for stack health ($((TRIES * 5))s / $((MAX_TRIES * 5))s) - not ready:$BAD"
              sleep 5
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::Service(s) failed to become healthy:$BAD"
            docker compose -f docker-compose.dev.yml ps -a
            for c in swipex-postgres swipex-redis swipex-job-data swipex-resume-service swipex-auth-gateway swipex-frontend; do
              state=$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$c" 2>/dev/null || echo "absent")
              if [ "$state" != "running/healthy" ]; then
                echo "::group::docker logs $c (previous 200 lines)"
                docker logs --tail=200 "$c" 2>&1 || true
                echo "::endgroup::"
              fi
            done
            exit 1
          fi

      - name: Run data_hanith domain suite (dataset-aware)
        if: steps.changes.outputs.integration == 'true'
        env:
          DATABASE_URL: postgresql://swipex:swipex@localhost:5432/swipex_job
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set +e
          if [ -f "data/raw/indian-job-market-dataset-2025.xlsx" ]; then
            pytest tests/ -v > /tmp/run-data.log 2>&1
            echo "$?" > /tmp/rc-data
          else
            {
              echo "Raw dataset not vendored — full execution skipped."
              pytest tests/ --collect-only -q
            } > /tmp/run-data.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo 0 > /tmp/rc-data
              echo "SKIPPED - raw dataset not vendored" > /tmp/note-data
            else
              echo "$rc" > /tmp/rc-data
            fi
          fi
          tail -n 30 /tmp/run-data.log
          exit 0

      - name: Seed job database for downstream suites
        if: steps.changes.outputs.integration == 'true'
        env:
          DATABASE_URL: postgresql://swipex:swipex@localhost:5432/swipex_job
        run: python integration_omkar/scripts/seed_all.py

      - name: Run Auth & Gateway unit tests (backend_mansi)
        if: steps.changes.outputs.integration == 'true'
        run: |
          set +e
          pytest backend_mansi/tests/ -v > /tmp/run-backend.log 2>&1
          echo "$?" > /tmp/rc-backend
          tail -n 30 /tmp/run-backend.log
          exit 0

      - name: Run Resume/AI unit tests (aiml_hemalatha)
        if: steps.changes.outputs.integration == 'true'
        run: |
          set +e
          (cd aiml_hemalatha && pytest tests/ -v) > /tmp/run-aiml.log 2>&1
          echo "$?" > /tmp/rc-aiml
          tail -n 30 /tmp/run-aiml.log
          exit 0

      - name: Run E2E + cross-service RBAC suite (integration_omkar)
        if: steps.changes.outputs.integration == 'true'
        run: |
          set +e
          pytest integration_omkar/tests/ -v > /tmp/run-e2e.log 2>&1
          echo "$?" > /tmp/rc-e2e
          tail -n 40 /tmp/run-e2e.log
          exit 0

      - name: Publish cross-team integration summary
        if: ${{ always() && steps.changes.outputs.integration == 'true' }}
        run: |
          python - <<'PYEOF'
          import os

          services = [
              ("auth-gateway (backend_mansi) unit", "rc-backend"),
              ("resume/AI (aiml_hemalatha) unit", "rc-aiml"),
              ("job/data (data_hanith) domain", "rc-data"),
              ("E2E + cross-service RBAC", "rc-e2e"),
          ]
          all_ok = True
          lines = []
          for label, key in services:
              rc_file = f"/tmp/{key}"
              if not os.path.exists(rc_file):
                  lines.append(f"- {label}: DID NOT RUN")
                  all_ok = False
                  continue
              rc = int(open(rc_file).read().strip())
              note_file = f"/tmp/note-{key[3:]}"
              note = ""
              if os.path.exists(note_file):
                  note = f" ({open(note_file).read().strip()})"
              if rc == 0:
                  lines.append(f"- {label}: :white_check_mark: PASS{note}")
              else:
                  lines.append(f"- {label}: :x: FAIL{note}")
                  all_ok = False
          result = "PASS" if all_ok else "FAIL"
          icon = ":white_check_mark:" if all_ok else ":x:"
          header = (
              f"## Cross-Team Integration Check — {icon} {result}\n\n"
              "This check rebuilt the full Docker stack from scratch and ran the shared test suite "
              "(unit + E2E + cross-service RBAC). No deployment activity occurs.\n\n"
          )
          body = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(header + body + "\n")
          print(body)
          raise SystemExit(0 if all_ok else 1)
          PYEOF