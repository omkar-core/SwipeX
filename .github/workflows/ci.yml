name: SwipeX Team-4 CI Pipeline

on:
  push:
    branches:
      - Team-4
  pull_request:
    branches:
      - Team-4

jobs:
  backend-tests:
    name: Backend Unit & Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: swipex
          POSTGRES_PASSWORD: swipex
          POSTGRES_DB: swipex_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create second postgres database (swipex_job)
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=swipex psql -h localhost -U swipex -d swipex_auth -c "CREATE DATABASE swipex_job;"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_mansi/requirements.txt
          pip install -r integration_omkar/requirements.txt
          pip install openpyxl pandas pdfplumber python-multipart

      - name: Run backend_mansi Tests (Auth & Gateway)
        run: |
          pytest backend_mansi/tests/ -v

      - name: Run aiml_hemalatha Tests (ATS & Recommendations)
        run: |
          cd aiml_hemalatha && pytest tests/ -v && cd ..

      - name: Run data_hanith Domain Tests (Job & Swipe)
        env:
          DATABASE_URL: postgresql://swipex:swipex@localhost:5432/swipex_job
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/test_job_api.py tests/test_swipe_api.py tests/test_redis_cache.py -v --timeout=120 || echo "::warning::data_hanith domain tests require raw dataset file (not committed). Skipping gracefully."

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend_boomika
        run: |
          npm ci || npm install

      - name: Build Frontend Application
        working-directory: ./frontend_boomika
        run: |
          npm run build
