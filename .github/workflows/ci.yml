name: CI - Milestone 4 Integration & QA Validation

on:
  push:
    branches: [Team-4, main]
  pull_request:
    branches: [Team-4, main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend Quality Gate (ESLint, Unit Tests, TypeScript Build)
  # ---------------------------------------------------------------------------
  frontend-validation:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_boomika/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend_boomika
          npm ci

      - name: Run ESLint
        run: |
          cd frontend_boomika
          npm run lint

      - name: Run Unit Tests (Vitest)
        run: |
          cd frontend_boomika
          npm run test

      - name: Build Production Frontend
        run: |
          cd frontend_boomika
          npm run build

  # ---------------------------------------------------------------------------
  # 2. Backend & Identity Management Service Tests (Intern 2)
  # ---------------------------------------------------------------------------
  backend-service-tests:
    name: Backend & Identity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_mansi/requirements.txt

      - name: Execute Backend Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend_mansi
        run: |
          python -m pytest backend_mansi/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 3. AI/ML Career Intelligence Service Tests (Intern 4)
  # ---------------------------------------------------------------------------
  aiml-service-tests:
    name: AI/ML & Recommendations Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aiml_hemalatha/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Execute AIML Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/aiml_hemalatha:${{ github.workspace }}/integration_omkar/docker/shim
        run: |
          python -m pytest aiml_hemalatha/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 4. Milestone 4 End-to-End Integration, ATS & Analytics Suite
  # ---------------------------------------------------------------------------
  m4-integration-tests:
    name: M4 Integration, Analytics & ATS Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_mansi/requirements.txt
          pip install -r data_hanith/requirements.txt
          pip install -r integration_omkar/requirements.txt

      - name: Execute Milestone 4 Integration Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend_mansi:${{ github.workspace }}/data_hanith:${{ github.workspace }}/aiml_hemalatha:${{ github.workspace }}/integration_omkar/docker/shim
        run: |
          python -m pytest tests/test_m4_day1_foundation.py tests/test_m4_day2_integration.py tests/test_m4_day3_analytics.py tests/test_m4_day4_optimization_and_concurrency.py tests/test_m4_day5_production_finalization.py integration_omkar/tests/unit/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 5. Infrastructure, Compose & Deployment Architecture Validation
  # ---------------------------------------------------------------------------
  infrastructure-validation:
    name: Docker Compose & Render Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.dev.yml config

      - name: Validate Render Blueprint Specification
        run: |
          python -c "import yaml; yaml.safe_load(open('render.yaml'))"