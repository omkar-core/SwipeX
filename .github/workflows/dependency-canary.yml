name: Dependency Drift Canary (Informational)

on:
  schedule:
    - cron: '0 4 * * 1' # Runs weekly on Mondays at 04:00 UTC
  workflow_dispatch:      # Allows manual trigger to check upstream ecosystem drift

permissions:
  contents: read

jobs:
  canary-unit:
    name: Upstream Unpinned Compatibility Canary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Unpinned Upstream Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r backend_mansi/requirements.txt \
            -r data_hanith/requirements.txt \
            -r aiml_hemalatha/requirements.txt \
            -r integration_omkar/requirements.txt \
            flake8 pyyaml pytest-timeout pytest-asyncio

      - name: Bootstrap Deterministic SQLite Test DB
        run: |
          python integration_omkar/scripts/bootstrap_test_db.py

      - name: Run Unit Suites against Latest Upstream
        run: |
          python integration_omkar/scripts/run_suites.py --suite ci-unit --no-docker
