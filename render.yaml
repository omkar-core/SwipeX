# SwipeX Milestone 4 — Render Infrastructure as Code (Blueprint)
# Specification: https://render.com/docs/blueprint-spec
# Verified for Render Free Tier Limits (October 2026)

databases:
  - name: swipex-omkar-postgres
    databaseName: swipex_auth
    user: swipex
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. Frontend Web Client (Static Site on Global CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-omkar-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend_boomika
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_BASE_API_URL
        value: https://swipex-omkar-gateway.onrender.com/api/v1
      - key: VITE_API_URL
        value: https://swipex-omkar-gateway.onrender.com
      - key: VITE_WS_URL
        value: wss://swipex-omkar-gateway.onrender.com/api/v1/notifications/ws
      - key: VITE_USE_MOCK
        value: "false"

  # ---------------------------------------------------------------------------
  # 2. Auth Service & API Gateway (Unified Web Service: React Client + Gateway)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-omkar-gateway
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash integration_omkar/deploy/build_render.sh
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app integration_omkar.deploy.combined_app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-omkar-postgres
          property: connectionString
      - key: RUN_MIGRATION
        # Exactly ONE service runs migrations to avoid race conditions.
        # Protected by Postgres advisory lock (pg_advisory_lock).
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GATEWAY_SHARED_SECRET
        generateValue: true
      - key: VITE_BASE_API_URL
        value: /api/v1
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        value: https://swipex-bpgb.onrender.com
      - key: VITE_WS_URL
        value: wss://swipex-bpgb.onrender.com/api/v1/notifications/ws
      - key: JOB_SERVICE_URL
        value: https://swipex-omkar-jobs.onrender.com
      - key: RESUME_SERVICE_URL
        value: https://swipex-omkar-resume.onrender.com
      - key: MATCHING_ENGINE_URL
        value: https://swipex-omkar-resume.onrender.com
      - key: CORS_ORIGINS
        value: https://swipex-omkar-web.onrender.com

  # ---------------------------------------------------------------------------
  # 3. Job & Data Intelligence Service (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-omkar-jobs
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r data_hanith/requirements.txt -r integration_omkar/requirements-prod.txt
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app data_hanith.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-omkar-postgres
          property: connectionString
      - key: GATEWAY_SHARED_SECRET
        fromService:
          type: web
          name: swipex-omkar-gateway
          envVarKey: GATEWAY_SHARED_SECRET
      - key: TRUST_GATEWAY_HEADERS
        value: "true"

  # ---------------------------------------------------------------------------
  # 4. Resume & AI Career Intelligence Service (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-omkar-resume
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r aiml_hemalatha/requirements.txt -r integration_omkar/requirements-prod.txt
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app aiml_hemalatha.app.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JOB_SERVICE_URL
        value: https://swipex-omkar-jobs.onrender.com
