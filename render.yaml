# SwipeX Milestone 4 — Render Infrastructure as Code (Blueprint)
# Specification: https://render.com/docs/blueprint-spec
# Verified for Render Free Tier Limits (October 2026)

databases:
  - name: swipex-postgres
    databaseName: swipex_auth
    user: swipex
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. Key Value / Redis Cache Store (Free Tier: 25 MB RAM, 50 conns)
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: swipex-redis
    plan: free
    region: oregon

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Client (Static Site on Global CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend_boomika
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_BASE_API_URL
        value: https://swipex-auth-gateway.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://swipex-auth-gateway.onrender.com/api/v1/notifications/ws
      - key: VITE_USE_MOCK
        value: "false"

  # ---------------------------------------------------------------------------
  # 3. Auth Service & API Gateway (Web Service with WebSocket support)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-auth-gateway
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend_mansi/requirements.txt -r data_hanith/requirements.txt -r integration_omkar/requirements-prod.txt
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app backend_mansi.app.main:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swipex-redis
          property: connectionString
      - key: RUN_MIGRATION
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GATEWAY_SHARED_SECRET
        generateValue: true
      - key: JOB_SERVICE_URL
        value: https://swipex-job-service.onrender.com
      - key: RESUME_SERVICE_URL
        value: https://swipex-resume-service.onrender.com
      - key: MATCHING_ENGINE_URL
        value: https://swipex-resume-service.onrender.com
      - key: CORS_ORIGINS
        value: https://swipex-frontend.onrender.com

  # ---------------------------------------------------------------------------
  # 4. Job & Data Intelligence Service (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-job-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r data_hanith/requirements.txt -r integration_omkar/requirements-prod.txt
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app data_hanith.main:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-postgres
          property: connectionString
      - key: GATEWAY_SHARED_SECRET
        fromService:
          type: web
          name: swipex-auth-gateway
          envVarKey: GATEWAY_SHARED_SECRET
      - key: TRUST_GATEWAY_HEADERS
        value: "true"

  # ---------------------------------------------------------------------------
  # 5. Resume & AI Career Intelligence Service (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: swipex-resume-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r aiml_hemalatha/requirements.txt -r integration_omkar/requirements-prod.txt
    startCommand: python integration_omkar/deploy/entrypoint_render.py --app aiml_hemalatha.app.main:app
    healthCheckPath: /health
    envVars:
      - key: JOB_SERVICE_URL
        value: https://swipex-job-service.onrender.com
